name: testing

on:
  push:
    branches: [main, trying, staging]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: cargo build --verbose --features ffi
      - name: Run tests (mock backend)
        run: cargo test --verbose
      - name: Clippy
        run: cargo clippy --all-targets --features ffi -- -D warnings
      - name: Format
        run: cargo fmt --check
