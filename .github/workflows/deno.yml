name: deno

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Install rust
        uses: dtolnay/rust-toolchain@stable

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Build
        shell: bash
        run: |
          set -xeuo pipefail
          rustc --version
          cargo --version
          cargo build --release --features ffi
      - name: Check
        run: deno check
      - name: Lint
        run: deno lint
      - name: Format
        run: deno fmt --check
      - name: Test (mock backend)
        run: deno task test
