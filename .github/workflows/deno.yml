name: deno

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Install rust
        uses: dtolnay/rust-toolchain@stable

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Build
        shell: bash
        run: |
          set -xeuo pipefail
          rustc --version
          cargo --version
          cargo build --release --features ffi
      - name: Check
        run: deno check
      - name: Lint
        run: deno lint
      - name: Format
        run: deno fmt --check
      - name: Test (mock backend)
        shell: bash
        run: WEBUSB_BACKEND=mock WEBUSB_LIBRARY=$(pwd)/target/release/$(case "$RUNNER_OS" in Windows) echo webusb.dll;; macOS) echo libwebusb.dylib;; *) echo libwebusb.so;; esac) deno test --allow-ffi --allow-env tests/webusb_test.ts

      - name: Release
        uses: softprops/action-gh-release@master
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: "release draft"
          draft: true
          files: |
            target/release/libwebusb.so
            target/release/libwebusb.dylib
            target/release/webusb.dll
