name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            built: libwebusb.dylib
            asset: libwebusb_aarch64.dylib
          - os: macos-latest
            target: x86_64-apple-darwin
            built: libwebusb.dylib
            asset: libwebusb_x86_64.dylib
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            built: libwebusb.so
            asset: libwebusb_aarch64.so
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            built: libwebusb.so
            asset: libwebusb_x86_64.so
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            built: webusb.dll
            asset: webusb_x86_64.dll
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Install rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --features ffi --target ${{ matrix.target }}

      - name: Rename artifact
        shell: bash
        run: cp target/${{ matrix.target }}/release/${{ matrix.built }} ${{ matrix.asset }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Create release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            libwebusb_aarch64.dylib
            libwebusb_x86_64.dylib
            libwebusb_aarch64.so
            libwebusb_x86_64.so
            webusb_x86_64.dll
