[package]
name = "webusb"
description = "WebUSB API implementation in Rust"
version = "0.6.0"
authors = ["Divy Srivastava <dj.srivastava23@gmail.com>"]
edition = "2021"
repository = "https://github.com/littledivy/webusb"
license = "MIT"
keywords = [
    "usb",
    "webusb"
]

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = ["native"]
# Real USB devices via nusb.
native = ["dep:nusb", "nusb/smol"]
# In-memory mock backend for tests and hardware-free development.
mock = ["dep:async-channel"]
# C ABI for the Deno FFI bindings.
ffi = ["native", "mock", "serde", "dep:serde_json"]
serde = ["dep:serde"]
# Backwards-compatible alias for the old feature name.
serde_derive = ["serde"]

[dependencies]
nusb = { version = "0.2.7", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
async-channel = { version = "2", optional = true }
futures-lite = "2"

[dev-dependencies]
webusb = { path = ".", features = ["mock"] }
futures-lite = "2"
